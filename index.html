<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBTC International Schools Map</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body {
            font-family: 'Open Sans', sans-serif;
            color: #333;
        }
        #map {
            height: 600px;
            width: 100%;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        .filter-container {
            margin: 20px 0;
            background: #f8f9fa;
            padding: 15px;
            border-radius: 5px;
        }
        .info-box {
            position: absolute;
            background: #fff;
            padding: 15px;
            border: 1px solid #003087;
            border-radius: 5px;
            z-index: 1000;
            display: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 300px;
            word-wrap: break-word;
        }
        .legend, .continent-breakdown, .reach-stats {
            background: #fff;
            padding: 10px;
            border: 1px solid #003087;
            border-radius: 5px;
            z-index: 1000;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            margin-bottom: 10px;
        }
        .legend div { margin: 5px 0; }
        .legend .color-box {
            display: inline-block;
            width: 20px;
            height: 20px;
            vertical-align: middle;
            margin-right: 5px;
            border: 1px solid #ccc;
        }
        .btn-primary {
            background-color: #003087;
            border-color: #003087;
        }
        .form-select, .form-check-input {
            border-color: #003087;
        }
        @media (max-width: 768px) {
            #map { height: 400px; }
            .filter-container { margin: 10px 0; padding: 10px; }
            .info-box, .legend, .continent-breakdown, .reach-stats { font-size: 14px; padding: 10px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="filter-container">
                    <button class="btn btn-primary mb-3" onclick="resetFilters()">Alle Filter zurücksetzen</button>
                    <div class="row">
                        <div class="col-md-4 mb-3">
                            <label for="continentFilter" class="form-label">Kontinent:</label>
                            <select id="continentFilter" class="form-select" onchange="filterMap()">
                                <option value="all">Alle</option>
                                <option value="Americas">Americas</option>
                                <option value="EAME">EAME (Europe, Africa, Middle East)</option>
                                <option value="Asia/Oceania">Asia/Oceania</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label for="countryFilter" class="form-label">Land:</label>
                            <select id="countryFilter" class="form-select" onchange="filterMap()">
                                <option value="all">Alle</option>
                            </select>
                        </div>
                        <div class="col-md-4 mb-3 d-flex align-items-end">
                            <div class="form-check">
                                <input type="checkbox" id="showYellow" class="form-check-input" checked onchange="filterMap()">
                                <label for="showYellow" class="form-check-label">Länder in RBTC vorbereitung anzeigen</label>
                            </div>
                        </div>
                    </div>
                </div>
                <div id="map"></div>
                <div id="infoBox" class="info-box">
                    <h3 id="countryName" class="h5"></h3>
                    <p>Kontinent: <span id="continent"></span></p>
                    <p>URL: <a id="countryUrl" href="#" target="_blank"></a></p>
                </div>
                <div class="legend">
                    <div><span class="color-box" style="background-color: #ffcccc;"></span> RBTC aktiv</div>
                    <div><span class="color-box" style="background-color: #ffff99;"></span> In Vorbereitung RBTC</div>
                </div>
                <div class="continent-breakdown"></div>
                <div class="reach-stats"></div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // RBTC-Länder-Daten mit URLs
        const rbtcCountriesData = [
            { continent: "EAME", name: "Albania", url: "rhema.eu", color: "red" },
            { continent: "EAME", name: "Angola", url: "rhema.org.br", color: "red" },
            { continent: "Americas", name: "Argentina", url: "rhema.org.br", color: "red" },
            { continent: "Asia/Oceania", name: "Australia", url: "rbtca.org.au", color: "red" },
            { continent: "EAME", name: "Austria", url: "rhema-austria.org", color: "red" },
            { continent: "EAME", name: "Botswana", url: "rhemabotswana.org", color: "red" },
            { continent: "Americas", name: "Brazil", url: "rhema.org.br", color: "red" },
            { continent: "Americas", name: "Canada", url: "rhemaquebec.org", color: "red" },
            { continent: "Americas", name: "Chile", url: "rhema.org.br", color: "red" },
            { continent: "Asia/Oceania", name: "China", url: "amoswong.org", color: "red" },
            { continent: "Americas", name: "Colombia", url: "www.rhemacolombia.com", color: "red" },
            { continent: "Americas", name: "Costa Rica", url: "rhemacostarica.org", color: "red" },
            { continent: "Americas", name: "Cuba", url: "www.rhemacolombia.com", color: "red" },
            { continent: "EAME", name: "Dem. Rep. Congo", url: "www.rhemakinshasa.com", color: "red" },
            { continent: "EAME", name: "Egypt", url: "https://www.facebook.com/rhemaegypt", color: "red" },
            { continent: "Asia/Oceania", name: "Fiji", url: "uttermostministries.org", color: "red" },
            { continent: "EAME", name: "France", url: "rhemafrance.com", color: "red" },
            { continent: "EAME", name: "Germany", url: "rhemagermany.de, rbtc.de", color: "red" },
            { continent: "EAME", name: "Ghana", url: "rhemaghana.org", color: "red" },
            { continent: "EAME", name: "Greece", url: "rhema.eu", color: "red" },
            { continent: "Americas", name: "Guatemala", url: "rbtcguatemala.org", color: "red" },
            { continent: "Americas", name: "Haiti", url: "facebook.com/rhemacentredeformationbibliquehaiti", color: "red" },
            { continent: "Asia/Oceania", name: "India", url: "rhema-chandigarh.org, rhemacoimbatore.org, rhemamumbai.com, rhemaindia.org.in", color: "red" },
            { continent: "Asia/Oceania", name: "Indonesia", url: "facebook.com/RhemaBibleTrainingCenterIndonesia", color: "red" },
            { continent: "EAME", name: "Italy", url: "rhemaitalia.it", color: "red" },
            { continent: "EAME", name: "Latvia", url: "rhema.lv", color: "red" },
            { continent: "EAME", name: "Kenya", url: "rhemakenya.org", color: "red" },
            { continent: "Asia/Oceania", name: "Malaysia", url: "rhemamalaysia.com", color: "red" },
            { continent: "Americas", name: "Mexico", url: "rhemamexico.org", color: "red" },
            { continent: "Asia/Oceania", name: "Myanmar", url: "rhemathailand.org", color: "red" },
            { continent: "EAME", name: "Netherlands", url: "rhema.nl", color: "red" },
            { continent: "EAME", name: "Nigeria", url: "rhemanigeria.com", color: "red" },
            { continent: "EAME", name: "Norway", url: "rhema.no", color: "red" },
            { continent: "Asia/Oceania", name: "Papua New Guinea", url: "rbtca.org.au", color: "red" },
            { continent: "Americas", name: "Peru", url: "", color: "red" },
            { continent: "Asia/Oceania", name: "Philippines", url: "mkmi.org", color: "red" },
            { continent: "EAME", name: "Poland", url: "www.rhema.org.pl", color: "red" },
            { continent: "EAME", name: "Portugal", url: "rhema.org.br", color: "red" },
            { continent: "EAME", name: "Congo", url: "", color: "red" },
            { continent: "Asia/Oceania", name: "Samoa", url: "www.uttermostministries.org", color: "red" },
            { continent: "Asia/Oceania", name: "Singapore", url: "rhema.org.sg", color: "red" },
            { continent: "EAME", name: "Switzerland", url: "rhemasuisse.com, rhema-schweiz.ch", color: "red" },
            { continent: "Asia/Oceania", name: "Thailand", url: "www.rhemathailand.org", color: "red" },
            { continent: "EAME", name: "Ukraine", url: "facebook.com/rhema-ukraine", color: "red" },
            { continent: "EAME", name: "United Kingdom", url: "rhemauk.com", color: "red" },
            { continent: "Americas", name: "United States", url: "rbtc.org", color: "red" }, // Angepasst an GeoJSON-Namen
            { continent: "Asia/Oceania", name: "Vanuatu", url: "uttermostministries.org", color: "red" },
            { continent: "EAME", name: "Zambia", url: "rhemazambia.org", color: "red" },
            // Neue Länder (gelb)
            { continent: "EAME", name: "Sweden", url: "", color: "yellow" },
            { continent: "EAME", name: "Finland", url: "", color: "yellow" },
            { continent: "EAME", name: "Greenland", url: "", color: "yellow" },
            { continent: "EAME", name: "Ireland", url: "", color: "yellow" },
            { continent: "EAME", name: "Estonia", url: "", color: "yellow" }
        ];

        const allCountriesInContinents = {
            "EAME": 130, // Gesamtanzahl Länder in der EAME-Region
            "Americas": 35,
            "Asia/Oceania": 48
        };

        // Karte initialisieren
        const map = L.map('map').setView([20, 0], 2);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '© <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);

        let geoJsonLayer;
        let geoJsonData;

        fetch('https://d2ad6b4ur7yvpq.cloudfront.net/naturalearth-3.3.0/ne_110m_admin_0_countries.geojson')
            .then(response => response.json())
            .then(data => {
                geoJsonData = data;
                updateMap(); // Initiale Kartenanzeige
            })
            .catch(error => console.error('Fehler beim Laden der GeoJSON-Daten:', error));

        function updateMap() {
            if (!geoJsonData) return;
            if (geoJsonLayer) map.removeLayer(geoJsonLayer);

            const continentFilter = document.getElementById('continentFilter').value;
            const countryFilter = document.getElementById('countryFilter').value;
            const showYellow = document.getElementById('showYellow').checked;

            let filteredCountries;
            if (countryFilter !== 'all') {
                filteredCountries = [countryFilter];
            } else {
                filteredCountries = rbtcCountriesData
                    .filter(country =>
                        (continentFilter === 'all' || country.continent === continentFilter) &&
                        (showYellow || country.color !== 'yellow')
                    )
                    .map(country => country.name);
            }

            geoJsonLayer = L.geoJSON(geoJsonData, {
                filter: function(feature) {
                    return filteredCountries.includes(feature.properties.name);
                },
                style: function(feature) {
                    const country = rbtcCountriesData.find(c => c.name === feature.properties.name);
                    return {
                        fillColor: country ? (country.color === "yellow" ? '#ffff99' : '#ffcccc') : 'transparent',
                        weight: 1,
                        opacity: 1,
                        color: '#003087',
                        fillOpacity: 0.5
                    };
                },
                onEachFeature: function(feature, layer) {
    const countryName = feature.properties.name;
    const rbtcCountry = rbtcCountriesData.find(c => c.name === countryName);
    if (rbtcCountry) {
        layer.bindTooltip(countryName, { permanent: false, direction: "auto" });
        layer.on('click', (e) => {
            showInfo(rbtcCountry, e.latlng);
            setCountryFilter(rbtcCountry.name);
        });
        if (document.getElementById('countryFilter').value !== 'all') {
            map.fitBounds(layer.getBounds());
        }
    }
}
            }).addTo(map);

            if (countryFilter === 'all' && continentFilter === 'all') {
                map.setView([20, 0], 2);
            }
        }

        function updateCountryFilter() {
            const continentFilter = document.getElementById('continentFilter').value;
            const showYellow = document.getElementById('showYellow').checked;
            const countrySelect = document.getElementById('countryFilter');
            const currentValue = countrySelect.value;
            countrySelect.innerHTML = '<option value="all">Alle</option>';
            const filteredCountries = rbtcCountriesData
                .filter(country =>
                    (continentFilter === 'all' || country.continent === continentFilter) &&
                    (showYellow || country.color !== 'yellow')
                )
                .sort((a, b) => a.name.localeCompare(b.name));
            filteredCountries.forEach(country => {
                const option = document.createElement('option');
                option.value = country.name;
                option.textContent = country.name;
                countrySelect.appendChild(option);
            });
            if (filteredCountries.some(c => c.name === currentValue)) {
                countrySelect.value = currentValue;
            }
        }

        function filterMap() {
            updateCountryFilter();
            updateMap();
        }

        function resetFilters() {
            document.getElementById('continentFilter').value = 'all';
            document.getElementById('countryFilter').value = 'all';
            document.getElementById('showYellow').checked = true;
            filterMap();
            hideInfoBox();
        }

        function showInfo(country, latlng) {
            const infoBox = document.getElementById('infoBox');
            document.getElementById('countryName').textContent = country.name;
            document.getElementById('continent').textContent = country.continent;
            document.getElementById('countryUrl').textContent = country.url || "Keine spezifische URL verfügbar";
            document.getElementById('countryUrl').href = country.url ? `https://${country.url.split(',')[0].trim()}` : "#";
            infoBox.style.display = 'block';
            const point = map.latLngToContainerPoint(latlng);
            infoBox.style.top = `${point.y}px`;
            infoBox.style.left = `${point.x}px`;
        }

        function hideInfoBox() {
            const infoBox = document.getElementById('infoBox');
            infoBox.style.display = 'none';
        }

function updateContinentBreakdown() {
    const breakdownContainer = document.querySelector('.continent-breakdown');
    breakdownContainer.innerHTML = '<h5>Aufschlüsselung nach Kontinenten</h5>';
    const groupedData = rbtcCountriesData.reduce((acc, country) => {
        if (!acc[country.continent]) acc[country.continent] = [];
        acc[country.continent].push(country);
        return acc;
    }, {});

    for (const [continent, countries] of Object.entries(groupedData)) {
        const countryList = countries.map(c => `
            <li>
                ${c.name} - ${c.url ? `<a href="https://${c.url.split(',')[0].trim()}" target="_blank">${c.url}</a>` : 'Keine spezifische URL verfügbar'} 
                (${c.color === 'yellow' ? 'In Vorbereitung RBTC' : 'RBTC aktiv'})
            </li>
        `).join('');
        breakdownContainer.innerHTML += `
            <div>
                <h6>${continent}</h6>
                <ul>${countryList}</ul>
            </div>
        `;
    }
}

function updateReachStats() {
    const statsContainer = document.querySelector('.reach-stats');
    statsContainer.innerHTML = '<h5>Erreichungsgrad pro Kontinent</h5>';
    const groupedData = rbtcCountriesData.reduce((acc, country) => {
        acc[country.continent] = (acc[country.continent] || 0) + 1;
        return acc;
    }, {});

    for (const [continent, rbtcCount] of Object.entries(groupedData)) {
        const totalCountries = allCountriesInContinents[continent] || 0;
        const reachPercentage = ((rbtcCount / totalCountries) * 100).toFixed(2);
        statsContainer.innerHTML += `
            <div>
                <strong>${continent}</strong>: ${rbtcCount} von ${totalCountries} Ländern (${reachPercentage}%) 
                (${rbtcCount} RBTC aktiv/In Vorbereitung)
            </div>
        `;
    }
}

        updateContinentBreakdown();
        updateReachStats();
        updateCountryFilter();
    </script>
</body>
</html>
