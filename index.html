<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RBTC Schools Map</title>
    <!-- Previous CSS remains the same -->
</head>
<body>
    <!-- Previous HTML structure remains the same until the script section -->
    
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Global variables
        let currentLanguage = 'de';
        let rbtcCountriesData = [];
        let geoJsonLayer;
        let geoJsonData;
        let translations = { de: {}, en: {} };

        // Load translations from CSV
        async function loadTranslations() {
            try {
                document.getElementById('loadingIndicator').style.display = 'block';
                const response = await fetch('translations.csv');
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                const lines = csvText.split('\n');
                const headers = lines[0].split(',');
                
                lines.slice(1).forEach(line => {
                    // Handle CSV parsing considering possible commas within quoted strings
                    const values = line.match(/(".*?"|[^",]+)(?=\s*,|\s*$)/g);
                    if (values) {
                        const key = values[0].replace(/"/g, '');
                        const deValue = values[1].replace(/"/g, '');
                        const enValue = values[2].replace(/"/g, '');
                        
                        translations.de[key] = deValue;
                        translations.en[key] = enValue;
                    }
                });
                return true;
            } catch (error) {
                console.error('Error loading translations:', error);
                alert('Error loading translations');
                return false;
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }

        // CSV parsing function for countries data
        function parseCSV(csv) {
            const lines = csv.split('\n');
            const headers = lines[0].split(',');
            return lines.slice(1).map(line => {
                const values = line.split(',');
                return headers.reduce((obj, header, index) => {
                    let value = values[index];
                    if (value && value.startsWith('"') && value.endsWith('"')) {
                        value = value.slice(1, -1);
                    }
                    obj[header.trim()] = value ? value.trim() : '';
                    return obj;
                }, {});
            });
        }

        // Load CSV data
        async function loadCountriesData() {
            try {
                document.getElementById('loadingIndicator').style.display = 'block';
                const response = await fetch('rbtc_countries.csv');
                if (!response.ok) throw new Error('Network response was not ok');
                const csvText = await response.text();
                rbtcCountriesData = parseCSV(csvText);
                updateCountryCounts();
                return true;
            } catch (error) {
                console.error('Error loading countries data:', error);
                alert(translations[currentLanguage]['error-loading']);
                return false;
            } finally {
                document.getElementById('loadingIndicator').style.display = 'none';
            }
        }

        function updateCountryCounts() {
            const counts = {
                'Americas': 0,
                'EAME': 0,
                'Asia/Oceania': 0
            };
            
            rbtcCountriesData.forEach(country => {
                if (country.color === "red") {
                    counts[country.continent]++;
                }
            });

            const updateTranslation = (key, count, region) => {
                translations.de[key] = translations.de[key].replace(/\d+/, count);
                translations.en[key] = translations.en[key].replace(/\d+/, count);
            };

            updateTranslation('americas', counts['Americas']);
            updateTranslation('eame', counts['EAME']);
            updateTranslation('asia', counts['Asia/Oceania']);

            document.querySelector('[data-i18n="americas"]').textContent = translations[currentLanguage].americas;
            document.querySelector('[data-i18n="eame"]').textContent = translations[currentLanguage].eame;
            document.querySelector('[data-i18n="asia"]').textContent = translations[currentLanguage].asia;
        }

        function toggleLanguage() {
            currentLanguage = currentLanguage === 'de' ? 'en' : 'de';
            document.documentElement.lang = currentLanguage;
            updateUILanguage();
        }

        function updateUILanguage() {
            document.querySelectorAll('[data-i18n]').forEach(element => {
                const key = element.getAttribute('data-i18n');
                const translation = translations[currentLanguage][key];
                if (translation) {
                    if (element.tagName === 'INPUT' && element.type === 'text') {
                        element.placeholder = translation;
                    } else if (translation.includes('<a')) {
                        element.innerHTML = translation;
                    } else {
                        element.textContent = translation;
                    }
                }
            });

            const urlsContainer = document.getElementById('countryUrls');
            if (urlsContainer.textContent === translations[currentLanguage === 'de' ? 'en' : 'de']['no-url']) {
                urlsContainer.textContent = translations[currentLanguage]['no-url'];
            }

            updateCountryCounts();
            updateCountryFilter();
        }

        // Initialize map
        const map = L.map('map', {
            minZoom: 2,
            maxZoom: 8,
            center: [20, 0],
            zoom: 2,
            worldCopyJump: true,
            maxBounds: [[-90, -180], [90, 180]]
        });

        // ... (rest of the map initialization code remains the same)

        // Modified initialization function
        async function initialize() {
            const translationsLoaded = await loadTranslations();
            if (translationsLoaded) {
                const dataLoaded = await loadCountriesData();
                if (dataLoaded) {
                    await loadGeoJSONData();
                    updateUILanguage();
                    updateCountryFilter();
                    showSection('home');
                }
            }
        }

        // Start initialization when DOM is loaded
        document.addEventListener('DOMContentLoaded', initialize);
    </script>
</body>
</html>
